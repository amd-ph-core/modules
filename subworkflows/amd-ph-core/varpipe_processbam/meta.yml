name: "varpipe_processbam"
description: A subworkflow for processing and analyzing BAM files, including alignment, format conversion, duplicate marking, and coverage analysis.
keywords:
  - alignment
  - BAM
  - SAM
  - mapping
  - quality control
  - coverage
  - duplicates
  - indexing
  - reference genome
  - sequencing
  - BWA
  - Picard
  - Samtools
  - bioinformatics
components:
  - bwa/index:
      git_remote: https://github.com/nf-core/modules.git
  - picard/createsequencedictionary:
      git_remote: https://github.com/nf-core/modules.git
  - samtools/faidx:
      git_remote: https://github.com/nf-core/modules.git
  - varpipe/bwamem
  - picard/samformatconverter
  - picard/sortsam
  - picard/markduplicates:
      git_remote: https://github.com/nf-core/modules.git
  - picard/buildbamindex
  - samtools/view:
      git_remote: https://github.com/nf-core/modules.git
  - samtools/depth:
      git_remote: https://github.com/nf-core/modules.git
input:
  - ch_reads:
      type: file
      description: |
        The input reads channel
        Structure: [ val(meta), [ path(read1), path(read2) ] ]
  - ch_ref_fasta:
      type: file
      description: |
        Channel containing reference genome fasta.
        Structure: [ val(meta), path(fasta) ]
output:
  - bam:
      type: file
      description: |
        Processed BAM file
        Structure: [ val(meta), path(bam) ]
  - bai:
      type: file
      description: |
        BAM index file
        Structure: [ val(meta), path(bai) ]
  - coverage:
      type: file
      description: |
        Coverage statistics
        Structure: [ val(meta), path(tsv) ]
  - fai:
      type: file
      description: |
        Reference fasta index
        Structure: [ val(meta), path(fai) ]
  - unmapped:
      type: file
      description: |
        Unmapped reads BAM
        Structure: [ val(meta), path(unmapped) ]
  - mapped:
      type: file
      description: |
        Mapped reads BAM
        Structure: [ val(meta), path(mapped) ]
  - reference_dict:
      type: file
      description: |
        Channel containing reference dictionary.
        Structure: [ val(meta), path(dict) ]
      pattern: "*.dict"
  - multiqc_inputs:
      type: file
      description: |
        Channel containing multiqc input files
        Structure: [ path(varpipe_multiqc_files) ]
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@ztb2"
  - "@supark87"
  - "@smagala"
  - "@tstark-cdc"
maintainers:
  - "@ztb2"
  - "@lekalle"
  - "@supark87"
  - "@smagala"
  - "@tstark-cdc"
