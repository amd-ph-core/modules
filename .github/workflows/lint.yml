name: Run Linting
on:
  push:
    branches:
      # https://docs.renovatebot.com/key-concepts/automerge/#branch-vs-pr-automerging
      - "renovate/**" # branches Renovate creates
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NF_CORE_VER: "3.5.1"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  ###################
  # nf-core linting #
  ###################
  nf-core-changes:
    name: nf-core-changes
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.filter.outputs.modules }}
      modules_files: ${{ steps.module_names.outputs.result }}
      subworkflows: ${{ steps.filter.outputs.subworkflows }}
      subworkflows_files: ${{ steps.subworkflow_names.outputs.result }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            modules:
              - added|modified: 'modules/amd-ph-core/**'
            subworkflows:
              - added|modified: 'subworkflows/amd-ph-core/**'
          token: ""
          list-files: "json"

      - name: Get module name
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: module_names
        with:
          script: |
            return [...new Set(${{ steps.filter.outputs.modules_files }}
              .filter(x => x.endsWith('main.nf') || x.endsWith('.nf.test.snap'))
              .map(path => path
                .replace('modules/amd-ph-core/', '')
                .replace(/\/(main\.nf|tests\/.*)$/, '')
              )
            )];
      - name: Get subworkflow name
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: subworkflow_names
        with:
          script: |
            return [...new Set(${{ steps.filter.outputs.subworkflows_files }}
              .filter(x => x.endsWith('main.nf') || x.endsWith('.nf.test.snap'))
              .map(path => path
                .replace('subworkflows/amd-ph-core/', '')
                .replace(/\/(main\.nf|tests\/.*)$/, '')
              )
            )];

  nf-core-lint-modules:
    runs-on: ubuntu-latest
    name: nf-core lint modules
    needs: nf-core-changes
    if: ${{ needs.nf-core-changes.outputs.modules_files != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.nf-core-changes.outputs.modules_files || '[]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        id: cache-pip
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip
          restore-keys: |
            ${{ runner.os }}-pip

      - name: Install pip
        run: python -m pip install --upgrade pip

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2

      - name: Install nf-core tools
        run: pip install nf-core==${{ env.NF_CORE_VER }}

      - name: Lint module ${{ matrix.module }}
        run: nf-core modules lint ${{ matrix.module }}

  nf-core-lint-subworkflows:
    runs-on: ubuntu-latest
    name: nf-core lint subworkflows
    needs: nf-core-changes
    if: ${{ needs.nf-core-changes.outputs.subworkflows_files != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        subworkflow: ${{ fromJson(needs.nf-core-changes.outputs.subworkflows_files || '[]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2

      - name: Install nf-core tools
        run: pip install nf-core==${{ env.NF_CORE_VER }}

      - name: Lint subworkflow ${{ matrix.subworkflow }}
        # Subworkflow meta.yml uses an extended components schema with per-entry git_remote fields for cross-org module references
        run: nf-core subworkflows --git-remote https://github.com/amd-ph-core/modules.git lint ${{ matrix.subworkflow }}

  confirm-pass-lint:
    runs-on: ubuntu-latest
    needs: [nf-core-lint-modules, nf-core-lint-subworkflows]
    if: always()
    steps:
      - name: All tests ok
        if: ${{ success() || !contains(needs.*.result, 'failure') }}
        run: exit 0
      - name: One or more tests failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
