name: picard_buildbamindex
description: Builds index for an aligned BAM file allowing fast look up of data
keywords:
  - index
  - bam
  - picard
tools:
  - picard:
      description: |
        Generates a BAM index ".bai" file. This tool creates an index file for the input BAM that allows fast look-up of data in a BAM file, lke an index on a database.
      homepage: https://broadinstitute.github.io/picard/
      documentation: https://gatk.broadinstitute.org/hc/en-us/articles/360037227392-BuildBamIndex-Picard
      tool_dev_url: https://github.com/broadinstitute/picard
      licence:
        - "MIT"
      identifier: biotools:picard_tools
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - input:
        type: file
        description: Bam file to index
        pattern: "*.bam"
        ontologies: []
output:
  bai:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bai":
          type: file
          description: BAI index
          pattern: "*.bai"
          ontologies: []
  versions_picard:
    - - ${task.process}:
          type: string
          description: The name of the process
      - picard:
          type: string
          description: The name of the tool
      - 'picard CreateSequenceDictionary --version 2>&1 | grep -o "Version:.*" | cut -f2- -d:':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - picard:
          type: string
          description: The name of the tool
      - 'picard CreateSequenceDictionary --version 2>&1 | grep -o "Version:.*" | cut -f2- -d:':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@ztb2"
  - "@supark87"
  - "@smagala"
  - "@tstark-cdc"
maintainers:
  - "@ztb2"
  - "@supark87"
  - "@smagala"
  - "@tstark-cdc"
