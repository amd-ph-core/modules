name: "clockwork_minimap2"
description: Custom module for mapping sequencing reads to a reference genome using Minimap2, with read group assignment and alignment filtering.
keywords:
  - read alignment
  - mapping
  - sequencing
tools:
  - "minimap2":
      description: "Fast and versatile sequence alignment program"
      homepage: "https://github.com/lh3/seqtk"
      documentation: "https://github.com/lh3/seqtk"
      licence:
        - "MIT"
      identifier: ""
  - "samtools":
      description: "Tools for manipulating SAM/BAM/CRAM sequence alignment files"
      homepage: "https://htslib.org/"
      documentation: "https://htslib.org/doc/"
      doi: "10.1093/bioinformatics/bty560"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - reads:
        type: file
        description: Input FASTQ files with paired-end reads
        pattern: "*.fastq.gz"
        ontologies:
          - edam: http://edamontology.org/format_3989 # GZIP format
  - reference:
      type: file
      description: Reference genome file
      ontologies: []
output:
  sam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.sam":
          type: file
          description: SAM file containing mapped reads after filtering
          pattern: "*.sam"
          ontologies: []
  versions_minimap2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - minimap2:
          type: string
          description: The name of the tool
      - minimap2 --version 2>&1:
          type: eval
          description: The expression to obtain the version of the tool

  versions_samtools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools --version | sed -n "1s/^samtools //p":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - minimap2:
          type: string
          description: The name of the tool
      - minimap2 --version 2>&1:
          type: eval
          description: The expression to obtain the version of the tool

    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools --version | sed -n "1s/^samtools //p":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@smagala"
maintainers:
  - "@ztb2"
  - "@lekalle"
  - "@supark87"
  - "@smagala"
  - "@tstark-cdc"
