name: "mmseqs_translatedsearch"
description: Six-frame translated search of short reads against a prebuilt MMseqs2 protein target database
keywords:
  - metagenomics
  - translated search
  - protein homology
  - read recruitment
  - virus
tools:
  - "mmseqs2":
      description: |
        Software suite for very fast, sensitive sequence searching and clustering of massive
        protein and nucleotide sequence sets. This module uses `createdb` + `search` +
        `convertalis` with `--search-type 2`, i.e. a translated nucleotide-vs-protein search.
      homepage: "https://github.com/soedinglab/MMseqs2"
      documentation: "https://github.com/soedinglab/MMseqs2/wiki"
      tool_dev_url: "https://github.com/soedinglab/MMseqs2"
      doi: "10.1038/nbt.3988"
      licence:
        - "GPL-3.0-or-later"
      args_id: "$args"
      identifier: biotools:mmseqs
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information, e.g. `[ id:'sample1', single_end:false ]`
    - reads:
        type: file
        description: |
          Mandatory. Gzipped FASTQ, one file for single-end or two for paired-end. Mates are
          searched together in one query database: a hit on either mate places the fragment,
          and keeping them in one database avoids paying the target index load twice.
        pattern: "*.{fastq,fq}.gz"
        ontologies:
          - edam: http://edamontology.org/format_1930 # FASTQ
  - target_db:
      type: directory
      description: |
        Mandatory. Directory holding a PREBUILT MMseqs2 target database named `targetdb`. A
        prebuilt database rather than a FASTA is deliberate: `createdb` on ~1.1M ORFs is the
        dominant cost of a one-off search, and repeating it per sample would swamp the ~100 s
        the search itself takes.
      pattern: "*"

output:
  hits:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${meta.id}.mmseqs.m8.gz:
          type: file
          description: |
            Gzipped BLAST tabular (m8) hits with columns
            `query,target,pident,alnlen,evalue,bits`.
          pattern: "*.mmseqs.m8.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions_mmseqs2:
    - - ${task.process}:
          type: string
          description: Name of the process that produced the version
      - mmseqs2:
          type: string
          description: Name of the tool
      - mmseqs version:
          type: eval
          description: Version of MMseqs2
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Name of the process that produced the version
      - mmseqs2:
          type: string
          description: Name of the tool
      - mmseqs version:
          type: eval
          description: Version of MMseqs2
authors:
  - "@smagala"
maintainers:
  - "@smagala"
