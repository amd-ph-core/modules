name: "kraken2_extractreads"
description: |
  Classifies reads with Kraken2 and extracts the reads assigned (or, with
  `--exclude`, not assigned) to the given taxa, in one task. The per-read
  assignment file is read where it is written instead of being staged into a
  second task. Extraction streams the reads in order, compresses in parallel and
  writes a status file saying whether any reads were extracted.
  extract_kraken_reads_parallel.py ships in this module's resources/usr/bin, so
  pipelines must set `nextflow.enable.moduleBinaries = true`.
keywords:
  - kraken2
  - classification
  - taxonomy
  - extraction
  - host removal
  - fastq
tools:
  - kraken2:
      description: |
        Kraken2 is a taxonomic sequence classifier that assigns taxonomic labels to sequence reads.
      homepage: https://ccb.jhu.edu/software/kraken2/
      documentation: https://github.com/DerrickWood/kraken2/wiki/Manual
      doi: 10.1186/s13059-019-1891-0
      licence:
        - "MIT"
      identifier: biotools:kraken2
  - extract_kraken_reads_parallel.py:
      description: |
        Streams FASTQ records against the Kraken2 assignment file and writes the
        selected reads with parallel gzip compression; falls back to an on-disk
        index when the two are not in the same order. Ships in this module's
        resources/usr/bin.
      homepage: "https://github.com/amd-ph-core/modules/tree/main/modules/amd-ph-core/kraken2/extractreads/resources/usr/bin"
      identifier: ""
  - pigz:
      description: Parallel implementation of gzip
      homepage: https://zlib.net/pigz/
      licence:
        - "zlib"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - reads:
        type: file
        description: |
          List of gzipped FASTQ files: one for single-end data, two for paired-end data.
        pattern: "*.{fastq.gz,fq.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1930 # FASTQ
  - db:
      type: directory
      description: Kraken2 database
  - taxid:
      type: string
      description: |
        Taxon ID(s) to extract, separated by spaces. Reads assigned to these taxa
        are kept, or removed when `ext.args2` contains `--exclude`.
  - save_output_fastqs:
      type: boolean
      description: |
        If true, Kraken2's classified and unclassified reads are also written as FASTQ.
  - save_reads_assignment:
      type: boolean
      description: |
        If true, the per-read Kraken2 assignment file is kept as an output.
output:
  extracted_kraken2_reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*.extracted_kraken2_read*.fastq.gz":
          type: file
          description: Extracted reads, one file for single-end data, two for paired-end data
          pattern: "*.extracted_kraken2_read*.fastq.gz"
          ontologies:
            - edam: http://edamontology.org/format_1930 # FASTQ
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*.kraken2.report.txt":
          type: file
          description: Kraken2 report with per-taxon read counts
          pattern: "*.kraken2.report.txt"
          ontologies: []
  reads_present:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - READS_PRESENT:
          type: string
          description: "`true` if any reads were extracted, otherwise `false`"
  status:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*.extract_kraken_reads.status.json":
          type: file
          description: Extraction status, including record counts and whether any reads were extracted
          pattern: "*.extract_kraken_reads.status.json"
          ontologies:
            - edam: http://edamontology.org/format_3464 # JSON
  classified_reads_fastq:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*.classified{.,_}*.fastq.gz":
          type: file
          description: Reads Kraken2 classified (only when `save_output_fastqs` is true)
          pattern: "*.classified{.,_}*.fastq.gz"
          ontologies:
            - edam: http://edamontology.org/format_1930 # FASTQ
  unclassified_reads_fastq:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*.unclassified{.,_}*.fastq.gz":
          type: file
          description: Reads Kraken2 left unclassified (only when `save_output_fastqs` is true)
          pattern: "*.unclassified{.,_}*.fastq.gz"
          ontologies:
            - edam: http://edamontology.org/format_1930 # FASTQ
  classified_reads_assignment:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*.kraken2.classifiedreads.txt":
          type: file
          description: Per-read Kraken2 assignments (only when `save_reads_assignment` is true)
          pattern: "*.kraken2.classifiedreads.txt"
          ontologies: []
  versions_kraken2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - kraken2:
          type: string
          description: The name of the tool
      - kraken2 --version 2>&1 | head -1 | sed "s/^.*Kraken version //; s/ .*//":
          type: eval
          description: The expression to obtain the version of the tool
  versions_extractor:
    - - ${task.process}:
          type: string
          description: The name of the process
      - extract_kraken_reads_parallel.py:
          type: string
          description: The name of the tool
      - extract_kraken_reads_parallel.py --version:
          type: eval
          description: The expression to obtain the version of the tool
  versions_pigz:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pigz:
          type: string
          description: The name of the tool
      - pigz --version 2>&1 | sed "s/^pigz //":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - kraken2:
          type: string
          description: The name of the tool
      - kraken2 --version 2>&1 | head -1 | sed "s/^.*Kraken version //; s/ .*//":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - extract_kraken_reads_parallel.py:
          type: string
          description: The name of the tool
      - extract_kraken_reads_parallel.py --version:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - pigz:
          type: string
          description: The name of the tool
      - pigz --version 2>&1 | sed "s/^pigz //":
          type: eval
          description: The expression to obtain the version of the tool
